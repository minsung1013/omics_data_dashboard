name: weekly-harvest

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:        # manual run button

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Harvest
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional; raises GEO rate limit
        run: python harvest.py

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json docs/meta.json
          if git diff --staged --quiet; then
            echo "No catalog changes this run."
          else
            git commit -m "weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
